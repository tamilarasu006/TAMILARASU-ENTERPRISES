services:
  - type: web
    name: tamilarasu-api
    env: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push && node prisma/seed.js
    startCommand: node src/app.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tamilarasu-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: "https://tamilarasuenterprises.netlify.app"
      - key: ADMIN_URL
        value: "https://tamilarasuenterprises.netlify.app/admin"

databases:
  - name: tamilarasu-db
    databaseName: tamilarasu
    user: admin
